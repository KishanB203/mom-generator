<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MoM Generator</title>
<meta name="description" content="Records your meetings and writes the minutes for you. Free Windows app.">
<link rel="icon" href="favicon.png">
<style>
  :root { --bg: #ffffff; --text: #111827; --muted: #5b6475; --brand: #2563eb; --brand-dark: #1d4ed8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1420; --text: #e8ecf4; --muted: #9aa4b8; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 "Segoe UI", system-ui, -apple-system, sans-serif;
         display: grid; place-items: center; text-align: center; padding: 24px 16px; }
  img { width: 72px; height: 72px; }
  h1 { font-size: clamp(28px, 6vw, 40px); margin: 14px 0 6px; letter-spacing: -0.02em; }
  p { color: var(--muted); margin: 0 0 28px; font-size: 18px; }
  .download { display: inline-flex; align-items: center; gap: 10px; background: var(--brand); color: #fff; text-decoration: none;
              padding: 14px 28px; border-radius: 10px; font-size: 18px; font-weight: 600; box-shadow: 0 6px 18px rgba(37, 99, 235, .3); }
  .download:hover { background: var(--brand-dark); }
  .download svg { width: 22px; height: 22px; }
  .meta { color: var(--muted); font-size: 14px; margin-top: 14px; }
  .meta a { color: inherit; }
  .meta + .meta { margin-top: 4px; }
</style>
</head>
<!-- data-repo: the GitHub repository whose latest release holds MoMGenerator-Setup.exe (auto-detected on github.io) -->
<body data-repo="KishanB203/mom-generator">
<main>
  <img src="icon.png" alt="">
  <h1>MoM Generator</h1>
  <p>Records your meetings and writes the minutes for you.</p>
  <a class="download" id="download" href="#">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
    Download for Windows
  </a>
  <div class="meta" id="meta">Windows 10 / 11</div>
  <div class="meta"><a href="https://github.com/KishanB203/mom-generator#privacy-policy">Privacy</a> ·
    <a href="https://github.com/KishanB203/mom-generator#code-signing-policy">Code signing policy</a></div>
</main>
<script>
  const FILE = "MoMGenerator-Setup.exe";
  const gh = location.hostname.match(/^([^.]+)\.github\.io$/i);
  const repo = gh && location.pathname.split("/")[1] ? `${gh[1]}/${location.pathname.split("/")[1]}` : document.body.dataset.repo;
  const releases = `https://github.com/${repo}/releases`;
  document.getElementById("download").href = `${releases}/latest/download/${FILE}`;
  fetch(`https://api.github.com/repos/${repo}/releases/latest`)
    .then(r => r.ok ? r.json() : Promise.reject(r.status))
    .then(rel => {
      const asset = (rel.assets || []).find(a => a.name === FILE);
      const size = asset ? ` · ${Math.round(asset.size / 1048576)} MB` : "";
      document.getElementById("meta").textContent = `Windows 10 / 11 · version ${rel.tag_name.replace(/^v/, "")}${size}`;
    })
    .catch(() => {});
</script>
</body>
</html>
